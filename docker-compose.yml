version: '3.8'

services:
  # 1. Relational & Telemetry TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: cybernova_timescaledb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cybernova_password
      POSTGRES_DB: cybernova_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  # 2. Attack Graph Database
  neo4j:
    image: neo4j:5.18-community
    container_name: cybernova_neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/cybernova_graph
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  # 3. Message Broker & In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: cybernova_redis
    restart: always
    ports:
      - "6379:6379"

  # 4. FastAPI Gateway & Risk Computation Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybernova_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:cybernova_password@timescaledb:5432/cybernova_db
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cybernova_graph
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb
      - neo4j
      - redis

  # 5. Celery Asynchronous Workers
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybernova_celery
    restart: always
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:cybernova_password@timescaledb:5432/cybernova_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - timescaledb

  # 6. Next.js 15 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybernova_frontend
    restart: always
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000/api/
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  timescaledb_data:
  neo4j_data: